# A User key (BLE profile switch and friends) consumes a one-shot layer like
# any other action, so the key after it is back on the base layer.

[layout]
rows = 1
cols = 3
map = """
(0,0)  (0,1)  (0,2)
"""

[[keymap.layer]]
keys = "OSL(1)  A  B"

[[keymap.layer]]
keys = "No  User0  No"

[[test]]
name = "osl_consumed_by_user_key"
steps = [
  { tap = { pos = [0, 0], duration = 10 } },
  { tap = { pos = [0, 1], duration = 10 } },
  { tap = { pos = [0, 2], duration = 10 } },
]
expect = [["B"], []]
